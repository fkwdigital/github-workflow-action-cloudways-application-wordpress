name: "Enhanced SSH Deploy (Cloudways-friendly)"
description: "Deploy via rsync over SSH with enforced excludes, public/ publishing, and FOLDER_NAME support."
author: "FKW Digital <hello@fkwdigital.com>"
runs:
  using: "node24"
  main: "dist/index.js"

inputs:
  SSH_PRIVATE_KEY:
    description: "Private key contents (paste secret)"
    required: true
  REMOTE_HOST:
    description: "Destination host (Cloudways server IP)"
    required: true
  REMOTE_USER:
    description: "SSH username (Cloudways master user)"
    required: true
  REMOTE_PORT:
    description: "SSH port"
    default: "22"
  TARGET:
    description: "Absolute remote path. If omitted, TARGET_BASE + [/FOLDER_NAME] will be used."
    required: false
  TARGET_BASE:
    description: "Absolute base path on remote (e.g. /home/master/applications/APPID/public_html)"
    required: false
  FOLDER_NAME:
    description: "Optional folder to append to TARGET_BASE (so you do not need to pass TARGET)"
    required: false
  SOURCE:
    description: "Relative local source. Defaults to public/ (contents)."
    default: "public/"
  RSYNC_ARGS:
    description: "Rsync args (space separated)."
    default: "-azvr --inplace --exclude='.*' --no-perms --no-times"
  SSH_PASSPHRASE:
    description: "Passphrase for the SSH private key (required by some managed hosts)"
    required: false
  KNOWN_HOSTS:
    description: "Contents of ~/.ssh/known_hosts for the server. Obtain via: ssh-keyscan -H your-host. Strongly recommended — omitting disables host key verification."
    required: false
  ARGS:
    description: "(Alias) Same as RSYNC_ARGS, to match cloudways-lab action naming."
    required: false
  EXCLUDE_FILE:
    description: "Optional path to an rsync --exclude-from file (e.g., ./public/exclude.txt)"
    required: false
  EXTRA_EXCLUDE:
    description: "Comma-separated extra exclude patterns appended to the built-in list."
    required: false
  CLOUDWAYS_API_TOKEN:
    description: "Optional Cloudways API access token. When set, application permissions are reset after deploy."
    required: false
  CLOUDWAYS_SERVER_ID:
    description: "Cloudways server ID (required when CLOUDWAYS_API_TOKEN is set)"
    required: false
  CLOUDWAYS_APP_ID:
    description: "Cloudways application ID (required when CLOUDWAYS_API_TOKEN is set)"
    required: false
  RESET_PERMISSIONS_OWNERSHIP:
    description: "Optional ownership for the permission reset: master_user or sys_user. Omitted uses Cloudways default."
    required: false
  CLOUDWAYS_API_URL:
    description: "Cloudways API base URL"
    default: "https://api.cloudways.com/api/v1"

branding:
  icon: "upload-cloud"
  color: "blue"
